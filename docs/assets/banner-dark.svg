	<text x="64" y="122" class="headword">ken<tspan class="dot">·</tspan>speck<tspan class="dot">·</tspan>le</text>
	<text x="64" y="170" class="pron">/ˈkɛnspɛkl/ <tspan class="pos" dx="10">adj.</tspan></text>
	<text x="64" y="216" class="etym">Scots, from Old Norse <tspan class="word">kennispeki</tspan> — ‘quick at recognising’</text>

	<line x1="64" y1="248" x2="1136" y2="248" stroke="#363a45" stroke-width="1"/>

	<text x="64" y="304" class="sense"><tspan class="sn">1.</tspan> easily recognised; conspicuous; familiar at sight.</text>
	<text x="64" y="352" class="sense"><tspan class="sn">2.</tspan> <tspan class="gloss">(of Svelte utilities)</tspan> knowable from the name alone.</text>

